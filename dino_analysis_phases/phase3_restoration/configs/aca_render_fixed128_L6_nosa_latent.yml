# =============================================================================
# aca-L6-nosa — aca-L6 with the ACA SELF-ATTENTION BRANCH REMOVED.
#
# THE ONE FACTOR IS F_sa, AND THE COMPARISON IS AGAINST aca-L6.
#
#     addition-render   guided = F + P(D)
#     aca-L6            guided = project_out(F_sa + alpha * F_ca) + F
#     aca-L6-nosa       guided = project_out(       alpha * F_ca) + F
#
# Same B6 layer, same render source, same mean, same injection point, same
# trunk, same schedule, same seed 100. Against aca-L6 this is a genuine
# one-factor ablation, and unusually for this project it is SMALLER, not
# larger: it removes exactly the 452,742 parameters of the F_sa branch.
#
# WHY. F_sa is the latent attending to ITSELF, which is Restormer's own MDTA
# step for step, and the ACA output goes straight into `self.latent` -- EIGHT
# transformer blocks that each already run that operation. Measured on
# dinolight-render's net_g_272000.pth: the F_sa half is 452,742 parameters,
# 43% of the whole ACA block, while the 8 latent blocks it feeds already hold
# 4,801,600 parameters of MDTA attention.
#
# WHAT THE TRAINED MODEL DID WITH IT. dinolight-render logs
# aca_ca_to_sa_ratio = ||alpha*F_ca|| / ||F_sa||. Over 300k it rose from 0
# (both alpha and P are zero-init, so F_ca starts at exactly 0) to a mean of
# 8.157 over the last 100k iterations: the DINO half carries ~8x the magnitude
# of the self half.
#
#   THAT IS A MAGNITUDE, NOT A CAUSAL RESULT. It is the reason this arm exists,
#   NOT a substitute for running it. A small-norm term can still matter: F_sa
#   is also the baseline the gated cross term is summed onto before one shared
#   project_out. Training this arm is what settles the question.
#
# THIS IS NOT A CLAIM THAT DINOLight IS IMPLEMENTED WRONGLY. dinolight-render
# reproduces a published block faithfully and should keep doing so.
#
# THREE COMPARISONS, THREE CAVEATS -- NEVER CONFLATE THEM:
#   vs aca-L6            ONE factor (F_sa), cross branch initialised
#                        IDENTICALLY. This is the comparison it was built for.
#   vs addition-render   add vs gated cross-attention, smaller capacity gap
#                        than aca-L6's ~4.6x but still NOT parameter-matched.
#   vs dinolight-render  THREE factors at once. Meaningless as an ablation.
#
# THE BLOCK IS `DinoAcaNoSa`, which SUBCLASSES `DinoAca` and deletes the SA
# half after construction. That is deliberate: the cross-attention path is the
# inherited code aca-L6 runs, and because the parent draws the SA projections
# first, the cross projections receive the SAME random draws aca-L6 gives them.
# The two arms start from an identical cross branch.
#
# MEANS ARE SHARED, NOT RECOMPUTED -- the same B6 mean addition-render and
# aca-L6 train with.
#
# projected_norm LOGS ||alpha * F_ca|| BEFORE the zero-init output conv, so
# injection_ratio is comparable to the OTHER ACA ARMS and is NOT comparable to
# the addition arms' ~1.03. aca_ca_to_sa_ratio is emitted as exactly 0.0 here
# rather than dropped, so the series keeps the same shape across the ladder.
#
# 1e7 IS TARGET ONLY. The render is DINO input and nothing else.
# =============================================================================

name: Holo_aca_render_fixed128_L6_nosa_latent
model_type: ImageCleanModelDinoSpatial
scale: 1
num_gpu: 1
manual_seed: 100
datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage_uint16_RenderStacked
    dataroot_gt: /home/woody/iwnt/iwnt174h/thesis_dino/holographic_image_dataset/train_clean
    dataroot_lq: /home/woody/iwnt/iwnt174h/thesis_dino/holographic_image_dataset/train_verynoisy
    dataroot_render: /home/woody/iwnt/iwnt174h/thesis_dino/holographic_image_dataset/train_renders_blackbg
    geometric_augs: true
    filename_tmpl: '{}'
    io_backend:
      type: disk
    use_shuffle: true
    num_worker_per_gpu: 2
    batch_size_per_gpu: 8
    mini_batch_sizes:
    - 8
    iters:
    - 300000
    gt_size: 256
    gt_sizes:
    - 128
    dataset_enlarge_ratio: 1
    prefetch_mode: null
  val:
    name: ValSet
    type: Dataset_PairedImage_uint16_RenderStacked
    dataroot_gt: /home/woody/iwnt/iwnt174h/thesis_dino/holographic_image_dataset/val_clean
    dataroot_lq: /home/woody/iwnt/iwnt174h/thesis_dino/holographic_image_dataset/val_verynoisy
    dataroot_render: /home/woody/iwnt/iwnt174h/thesis_dino/holographic_image_dataset/val_renders_blackbg
    io_backend:
      type: disk
network_g:
  type: RestormerAcaL6NoSaRender
  inp_channels: 1
  out_channels: 1
  dim: 48
  num_blocks:
  - 4
  - 6
  - 6
  - 8
  num_refinement_blocks: 4
  heads:
  - 1
  - 2
  - 4
  - 8
  ffn_expansion_factor: 2.66
  bias: false
  LayerNorm_type: WithBias
  dual_pixel_task: false
  dino_enabled: true
  dino_model: dinov2_vitb14
  dino_block: 6
  dino_fusion: aca
  dino_aca_heads: 6
  dino_aca_alpha_init: -2.0
  dino_aca_stats_freq: 5000
  dino_frozen: true
  dino_source: render
  dino_injection: latent
  dino_projection: conv1x1
  dino_init: zero
  dino_embed_dim: 768
  dino_default_mode: train128
  dino_mean_train128: /home/woody/iwnt/iwnt174h/thesis_dino/code/Restormer/dino_analysis_phases/phase3_restoration/means/render_B6_train128_dino224_mean.pt
  dino_mean_eval256: /home/woody/iwnt/iwnt174h/thesis_dino/code/Restormer/dino_analysis_phases/phase3_restoration/means/render_B6_eval256_dino448_mean.pt
dino_stability:
  enabled: true
  injection_ratio_max: 10.0
  ratio_rules_start_iter: 5000
  reference_iter: 5000
  growth_factor_max: 10.0
  log_freq: 1000
  devlog: /home/woody/iwnt/iwnt174h/thesis_dino/code/Restormer/dino_analysis_phases/phase3_restoration/devlogs/aca_render_fixed128_L6_nosa_latent.md
path:
  pretrain_network_g: null
  strict_load_g: true
  resume_state: null
train:
  total_iter: 300000
  warmup_iter: -1
  use_grad_clip: true
  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods:
    - 92000
    - 208000
    restart_weights:
    - 1
    - 1
    eta_mins:
    - 0.0003
    - 1.0e-06
  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true
  optim_g:
    type: AdamW
    lr: 0.0003
    weight_decay: 0.0001
    betas:
    - 0.9
    - 0.999
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean
val:
  window_size: 8
  val_freq: 4000.0
  save_img: false
  rgb2bgr: true
  use_image: true
  max_minibatch: 8
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
logger:
  print_freq: 1000
  save_checkpoint_freq: 2000.0
  use_tb_logger: true
  tb_logger_dir: tb_logger/Holo_aca_render_fixed128_L6_nosa_latent
  wandb:
    project: null
    resume_id: null
dist_params:
  backend: nccl
  port: 29500
