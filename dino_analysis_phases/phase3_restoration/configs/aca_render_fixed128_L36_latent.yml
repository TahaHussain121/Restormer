# =============================================================================
# aca-L36 — ACA fusion over the DINO layer set {3,6}.
#
# Interior point of the ACA layer ladder: the two SHALLOWEST measured depths.
#
# THE ACA LAYER LADDER. Fusion is IDENTICAL across all four arms — gated channel
# cross-attention, the same DinoAca block dinolight-render runs. Only the layer
# set changes:
#     aca-L6      {6}         no AFFM (a 1-layer softmax is identically 1.0)
#     aca-L36     {3,6}       AFFM then ACA
#     aca-L6912   {6,9,12}    AFFM then ACA
#     dinolight   {3,6,9,12}  AFFM then ACA
# The ONLY parameter difference across the ladder is 769 per AFFM scoring conv,
# i.e. well under 1%. A DIFFERENCE ACROSS THIS LADDER IS NOT ATTRIBUTABLE TO
# CAPACITY.
#
# DO NOT CONFLATE THAT WITH THE OTHER COMPARISON. Against addition-render this
# arm is ~4.6x the parameters, so THAT comparison IS capacity confounded.
#
# MEANS ARE SHARED, NOT RECOMPUTED. The same per-layer mean files
# dinolight-render and affm-render load. Identical centering is what keeps the
# ladder comparable on the feature side. The B6 entry is asserted byte-identical
# to the mean addition-render trains with (max abs diff 0.000e+00).
#
# projected_norm LOGS ||alpha * F_ca||, measured BEFORE the zero-init output
# conv. THIS MAKES injection_ratio ROUGHLY AN ORDER OF MAGNITUDE SMALLER THAN
# THE ADDITION ARMS' ~1.03 AND NOT DIRECTLY COMPARABLE TO THEM. The true
# injected delta is logged separately as aca_injected_norm.
#
# Everything else is identical to dinolight-render: render source, latent
# injection at inp_enc_level4, fixed 128 crop, batch 8, 300k iters, seed 100,
# CosineAnnealingRestartCyclicLR periods [92000, 208000], AdamW 3e-4/1e-4,
# L1 loss, val_freq 4000, and the stability gate (cap 10, ratio rules from
# 5000, NaN/Inf from 1).
#
# The per-layer mean keys are QUOTED STRINGS: basicsr/utils/options.py:109
# builds its startup dump with `k + ': '` and raises TypeError on an int key
# before iteration 1.
#
# 1e7 IS TARGET ONLY. The render is DINO input and nothing else.
# =============================================================================

name: Holo_aca_render_fixed128_L36_latent
model_type: ImageCleanModelDinoSpatial
scale: 1
num_gpu: 1
manual_seed: 100
datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage_uint16_RenderStacked
    dataroot_gt: /home/woody/iwnt/iwnt174h/thesis_dino/holographic_image_dataset/train_clean
    dataroot_lq: /home/woody/iwnt/iwnt174h/thesis_dino/holographic_image_dataset/train_verynoisy
    dataroot_render: /home/woody/iwnt/iwnt174h/thesis_dino/holographic_image_dataset/train_renders_blackbg
    geometric_augs: true
    filename_tmpl: '{}'
    io_backend:
      type: disk
    use_shuffle: true
    num_worker_per_gpu: 2
    batch_size_per_gpu: 8
    mini_batch_sizes:
    - 8
    iters:
    - 300000
    gt_size: 256
    gt_sizes:
    - 128
    dataset_enlarge_ratio: 1
    prefetch_mode: null
  val:
    name: ValSet
    type: Dataset_PairedImage_uint16_RenderStacked
    dataroot_gt: /home/woody/iwnt/iwnt174h/thesis_dino/holographic_image_dataset/val_clean
    dataroot_lq: /home/woody/iwnt/iwnt174h/thesis_dino/holographic_image_dataset/val_verynoisy
    dataroot_render: /home/woody/iwnt/iwnt174h/thesis_dino/holographic_image_dataset/val_renders_blackbg
    io_backend:
      type: disk
network_g:
  type: RestormerAcaL36Render
  inp_channels: 1
  out_channels: 1
  dim: 48
  num_blocks:
  - 4
  - 6
  - 6
  - 8
  num_refinement_blocks: 4
  heads:
  - 1
  - 2
  - 4
  - 8
  ffn_expansion_factor: 2.66
  bias: false
  LayerNorm_type: WithBias
  dual_pixel_task: false
  dino_enabled: true
  dino_model: dinov2_vitb14
  dino_block: 6
  dino_fusion: aca
  dino_aca_heads: 6
  dino_aca_alpha_init: -2.0
  dino_aca_stats_freq: 5000
  dino_frozen: true
  dino_source: render
  dino_injection: latent
  dino_projection: conv1x1
  dino_init: zero
  dino_embed_dim: 768
  dino_default_mode: train128
  dino_mean_train128: /home/woody/iwnt/iwnt174h/thesis_dino/code/Restormer/dino_analysis_phases/phase3_restoration/means/render_B6_train128_dino224_mean.pt
  dino_mean_eval256: /home/woody/iwnt/iwnt174h/thesis_dino/code/Restormer/dino_analysis_phases/phase3_restoration/means/render_B6_eval256_dino448_mean.pt
  dino_means_train128:
    '3': /home/woody/iwnt/iwnt174h/thesis_dino/code/Restormer/dino_analysis_phases/phase3_restoration/means/render_B3_train128_dino224_mean.pt
    '6': /home/woody/iwnt/iwnt174h/thesis_dino/code/Restormer/dino_analysis_phases/phase3_restoration/means/render_B6_train128_dino224_mean.pt
  dino_means_eval256:
    '3': /home/woody/iwnt/iwnt174h/thesis_dino/code/Restormer/dino_analysis_phases/phase3_restoration/means/render_B3_eval256_dino448_mean.pt
    '6': /home/woody/iwnt/iwnt174h/thesis_dino/code/Restormer/dino_analysis_phases/phase3_restoration/means/render_B6_eval256_dino448_mean.pt
dino_stability:
  enabled: true
  injection_ratio_max: 10.0
  ratio_rules_start_iter: 5000
  reference_iter: 5000
  growth_factor_max: 10.0
  log_freq: 1000
  devlog: /home/woody/iwnt/iwnt174h/thesis_dino/code/Restormer/dino_analysis_phases/phase3_restoration/devlogs/aca_render_fixed128_L36_latent.md
path:
  pretrain_network_g: null
  strict_load_g: true
  resume_state: null
train:
  total_iter: 300000
  warmup_iter: -1
  use_grad_clip: true
  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods:
    - 92000
    - 208000
    restart_weights:
    - 1
    - 1
    eta_mins:
    - 0.0003
    - 1.0e-06
  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true
  optim_g:
    type: AdamW
    lr: 0.0003
    weight_decay: 0.0001
    betas:
    - 0.9
    - 0.999
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean
val:
  window_size: 8
  val_freq: 4000.0
  save_img: false
  rgb2bgr: true
  use_image: true
  max_minibatch: 8
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
logger:
  print_freq: 1000
  save_checkpoint_freq: 2000.0
  use_tb_logger: true
  tb_logger_dir: tb_logger/Holo_aca_render_fixed128_L36_latent
  wandb:
    project: null
    resume_id: null
dist_params:
  backend: nccl
  port: 29500
