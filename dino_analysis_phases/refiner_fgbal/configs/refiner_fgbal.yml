# Holo_E0_frozen_noisy_output_fgbalanced_refiner -- ONE follow-up run to
# refiner_e0. Every key shared with refiner_e0/configs/refiner.yml must keep its
# value except name, loss and selection_metric (checked mechanically by
# fgbal_common.load_configs before training). Frozen once training starts.

name: Holo_E0_frozen_noisy_output_fgbalanced_refiner
based_on: Holo_E0_frozen_noisy_output_residual_refiner
frozen_base: Holo_E0_fixed128_baseline      # validation-selected checkpoint, resolved from metadata
protocol: full256                            # E0 on whole 256x256 frames; refiner trains and evaluates on whole frames
inputs: [noisy_X, E0_output_Y0]              # X first. No render, no DINO, no target-derived input.

seed: 100
optimizer: AdamW
lr: 1.0e-4
lr_min: 1.0e-6
betas: [0.9, 0.999]
weight_decay: 1.0e-4
batch_size: 16                                # physical; no accumulation unless it does not fit
grad_accum_steps: 1
max_updates: 10000
grad_clip_norm: 1.0
precision: float32                            # TF32 disabled explicitly
scheduler: cosine, 1e-4 -> 1e-6 over 10000 updates, no warmup
loss: region-balanced L1 on the UNBOUNDED Y0 + delta -- 0.5 * mean_fg|e| + 0.5 * mean_bg|e|, per-image region means averaged over images with a non-empty region
augmentation: none
drop_last: true                               # 6101 train frames -> 381 batches of 16 per epoch

val_every: 500
min_updates: 3000
patience_checks: 5                            # stop when 5 consecutive checks fail to improve the best, once >= 3000 updates
selection_metric: validation foreground PSNR (gt > 0.01), uint16 convention, among ELIGIBLE checkpoints; E0 (step 0) is the fallback

# --- new keys (not in refiner_e0) ---
fg_threshold: 0.01                            # the study's masked_metrics foreground, unchanged; checked on TRAINING targets
loss_region_weights: [0.5, 0.5]
eligibility: validation background MAE <= E0's AND background RMSE <= E0's, identical protocol (step-0 values of this run)
early_stopping_counts: checks without a new ELIGIBLE foreground-PSNR best (mechanics unchanged)
save_every_validation: true                   # both selection rules can be applied to this run
