# =============================================================================
# GENERATED from Holo_DINOv2_lqDINO_Restormer.yml -- do not hand-edit.
# Regenerate: python Deraining_Holo/make_gate_configs.py
#
# STABILITY GATE (DEVLOG Step 22). A 4000-iteration run whose ONLY purpose is to
# answer "is this run healthy?" before committing ~3 GPU-days to it. Identical to
# the full config except: total_iter 4000, val every 1000, print every 200, and
# its own experiment name so it never touches the real run's directory.
#
# PASS CRITERION: val PSNR at iter 4000 >= 18 dB.
# The Exp 2 baseline reached 19.62 dB at its first validation; the two FAILED
# unbounded-FiLM arms were at 3.22 and 7.80 dB at the same point. This gate would
# have caught that failure in ~30 minutes instead of ~20 GPU-hours.
# Also watch film_g_absmax (must stay <= film_gamma_scale) and film_g_std
# (near 0 => gamma is a constant rescale, not input-dependent guidance).
# =============================================================================
# general settings
# DINO VARIANT B (lqDINO): DINO sees the SAME noisy LQ crop as Restormer.
# dino_img defaults to None in the arch -> falls back to inp_img (the LQ).
name: Holo_DINOv2_lqDINO_GATE
model_type: ImageCleanModelDINO   # = ImageCleanModel + FiLM gamma/beta logging
scale: 1
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 100

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage_uint16
    dataroot_gt: /home/woody/iwnt/iwnt174h/thesis_dino/holographic_image_dataset/train_clean
    dataroot_lq: /home/woody/iwnt/iwnt174h/thesis_dino/holographic_image_dataset/train_verynoisy
    geometric_augs: true

    filename_tmpl: '{}'
    io_backend:
      type: disk

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 2
    batch_size_per_gpu: 8

    ### -------------Progressive training--------------------------
    mini_batch_sizes: [8,5,4,2]             # Batch size per gpu
    iters: [92000,64000,48000,96000]
    gt_size: 256   # Max patch size = native image resolution (no reflect-padding)
    gt_sizes: [128,160,192,256]  # Patch sizes for progressive training (capped at 256).
    ### ------------------------------------------------------------

    ### ------- Training on single fixed-patch size 128x128---------
    # mini_batch_sizes: [8]
    # iters: [300000]
    # gt_size: 128
    # gt_sizes: [128]
    ### ------------------------------------------------------------

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_PairedImage_uint16
    dataroot_gt: /home/woody/iwnt/iwnt174h/thesis_dino/holographic_image_dataset/val_clean
    dataroot_lq: /home/woody/iwnt/iwnt174h/thesis_dino/holographic_image_dataset/val_verynoisy
    io_backend:
      type: disk

# network structures
network_g:
  type: RestormerDINO
  inp_channels: 1
  out_channels: 1
  dim: 48
  num_blocks: [4,6,6,8]
  num_refinement_blocks: 4
  heads: [1,2,4,8]
  ffn_expansion_factor: 2.66
  bias: False
  LayerNorm_type: WithBias
  dual_pixel_task: False
  # --- DINOv2 FiLM guidance (the ONLY change vs baseline) ---
  dino_layers: [0, 3, 7, 11]   # 1-indexed {1,4,8,12} -> 0-indexed block ids
  dino_img_size: 224
  dino_model_name: dinov2_vitb14
  dino_hub_source: local       # offline: load from the cached repo dir, no internet
  dino_hub_dir: /home/woody/iwnt/iwnt174h/thesis_dino/code/torch_hub/hub/facebookresearch_dinov2_main
  dino_weights: /home/woody/iwnt/iwnt174h/thesis_dino/code/torch_hub/hub/checkpoints/dinov2_vitb14_pretrain.pth
  # CENTERING: fixed per-arm mean pooled feature (300 training NOISY-LQ crops,
  # crop sizes drawn in proportion to the progressive schedule), subtracted from
  # the pooled vector before the FiLM head. Same treatment as the renderDINO arm
  # so the two arms still differ ONLY in what image DINO looks at; the mean
  # itself is arm-specific because the domains differ.
  # Fixed mean, NOT BatchNorm -- batch drops to 2 at 256px.
  # Regenerate with Deraining_Holo/compute_dino_feat_mean.py.
  dino_feat_mean: /home/woody/iwnt/iwnt174h/thesis_dino/code/Restormer/Deraining_Holo/experiment_results/exp3_dino_film/dino_feat_mean_lqDINO.pt
  dino_stub: false             # true ONLY for the wiring sanity check
  film_hidden: 512
  # BOUNDED MODULATION (2026-08-07, DEVLOG Step 22). gamma/beta are tanh-squashed
  # and scaled, so (1+gamma) is confined to [0.5, 1.5]. The first E1 attempt left
  # them unbounded and |gamma| ran to 325: FiLM's scale degeneracy is a flat
  # direction in the loss, AdamW walks it outward at ~lr per step, grad-clip is
  # nearly a no-op under Adam, and decoupled wd contributes 3e-8/step. tanh(0)=0
  # so the zero-init identity is unchanged. 0.5 is a judgement call, not a
  # measured optimum: 0.1 would be so weak the result is an uninterpretable null,
  # 1.0 lets gamma=-1 zero out channels entirely.
  film_gamma_scale: 0.5
  film_beta_scale: 0.5


# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~   # null = fresh start
                    # to resume: set to experiments/Holo_Baseline_Restormer/training_states/ITER.state
                    # example:   experiments/Holo_Baseline_Restormer/training_states/92000.state

# training settings
train:
  total_iter: 4000
  warmup_iter: -1 # no warm up
  use_grad_clip: true

  # Original Restormer deraining schedule: two cycles.
  # 1st cycle: fixed 3e-4 LR for 92k iters (eta_min == initial lr => constant).
  # 2nd cycle: cosine anneal 3e-4 -> 1e-6 over 208k iters (92k -> 300k).
  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [92000, 208000]
    restart_weights: [1,1]
    eta_mins: [0.0003, 0.000001]

  mixing_augs:
    mixup: false     # disabled for the verynoisy run
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

# validation settings
val:
  window_size: 8
  val_freq: !!float 1e3
  save_img: false
  rgb2bgr: true
  use_image: true
  max_minibatch: 8

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 4e3
  use_tb_logger: true
  tb_logger_dir: tb_logger/Holo_DINOv2_lqDINO_GATE
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
