# Dataset spec for the DINO analysis pipeline. NOT a training config.
#
# HISTORY: this path used to hold the E1 renderDINO FiLM training config
# (RestormerDINO + ImageCleanModelRender + the whole progressive/gate schedule).
# E1 failed and was removed; see experiment_results/exp3_dino_film/E1_DINO_report.md
# for the writeup and the `dino_prior` branch for the original file.
#
# The path survives because dino_analysis/ reads it as its default --opt:
#   visualize_dino_spatial_pca.py:104  -> DEFAULT_OPT points here
#   phase1/analyze_dino_spatial_consistency.py:459
#   phase2/analyze_dino_prior_source.py:555
# They consume ONLY two things:
#   cfg['datasets']['val'] -- the three dataroots plus the keys
#     Dataset_PairedImage_uint16_Render needs to construct. phase1 additionally
#     rewrites '/val_' -> '/train_' in the dataroots to reach the training
#     split, so the val paths must keep that '/val_<name>' shape.
#   cfg['network_g'] -- five dino_* keys only (img_size, model_name, hub_source,
#     hub_dir, weights). No 'type', no FiLM keys: build_extractor() passes
#     feat_mean=None and centres its own way. The block is named network_g
#     purely because that is where the scripts look.
#
# WARNING: phase2 asserts dino_model_name / dino_weights / dino_hub_source match
# what phase1 recorded in phase1/outputs/phase1_metadata.json and aborts on a
# mismatch. Do not edit those three values without rerunning phase1.
#
# Nothing here is read by basicsr's training entrypoint.

name: HoloDINOAnalysis
model_type: ImageCleanModel
scale: 1
num_gpu: 1
manual_seed: 100

datasets:
  val:
    name: ValSet
    type: Dataset_PairedImage_uint16_Render
    dataroot_gt: /home/woody/iwnt/iwnt174h/thesis_dino/holographic_image_dataset/val_clean
    dataroot_lq: /home/woody/iwnt/iwnt174h/thesis_dino/holographic_image_dataset/val_verynoisy
    dataroot_render: /home/woody/iwnt/iwnt174h/thesis_dino/holographic_image_dataset/val_renders_blackbg
    io_backend:
      type: disk

# Frozen DINOv2 extractor settings read by dino_analysis (see header).
network_g:
  dino_img_size: 224
  dino_model_name: dinov2_vitb14
  dino_hub_source: local       # offline: load from the cached repo dir, no internet
  dino_hub_dir: /home/woody/iwnt/iwnt174h/thesis_dino/code/torch_hub/hub/facebookresearch_dinov2_main
  dino_weights: /home/woody/iwnt/iwnt174h/thesis_dino/code/torch_hub/hub/checkpoints/dinov2_vitb14_pretrain.pth
