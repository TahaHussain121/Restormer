# Holo_E0_oracle_masked_completion_diagnostic -- ONE bounded diagnostic run.
# Fixed before training. No sweep, no re-tuning: a change needs a new root.

name: Holo_E0_oracle_masked_completion_diagnostic
frozen_base: Holo_E0_fixed128_baseline        # validation-selected checkpoint, resolved from metadata; read-only
protocol: full256                             # whole 256x256 frames, as the existing refiners
inputs: [noisy_X, damaged_or_E0_image_Y_in, binary_mask_M]   # ground truth is NEVER an input channel
output: Y_out = Y_in + M * delta              # corrections restricted to the mask by construction

seed: 100
optimizer: AdamW
lr: 1.0e-4
lr_min: 1.0e-6
betas: [0.9, 0.999]
weight_decay: 1.0e-4
batch_size: 16
max_updates: 10000
grad_clip_norm: 1.0
precision: float32                            # TF32 disabled explicitly
scheduler: cosine, 1e-4 -> 1e-6 over 10000 updates, no warmup
augmentation: none
drop_last: true

loss: 0.5 * per-image mean |Y_out - G| over M  +  0.5 * per-image mean |Y_out - G| over (M and G > 0.01)
loss_note: >
  Both terms are per-image means over that image's own region, averaged over the
  images whose region is non-empty (an empty region contributes nothing and the
  other term is not renormalised). Outside M the error is exactly zero by
  construction, so unchanged pixels cannot dominate; the second term stops the
  black background inside a mask from dominating the structure it hides.

val_every: 500
min_updates: 3000
patience_checks: 5
selection_metric: >
  mean per-image in-mask PSNR (uint16 convention: clamp, x65535, round,
  data_range 1.0) on the FIXED synthetic completion validation task
  (cache/val_synth_masks.npz, seed 4242), over validation images with a
  non-empty mask. Actual-E0-failure results are never used for selection.
corruption_recipe: code/corruption.py, version fixed-2026-09-23 (calibrated on training data only)
oracle_mask_rule: target > 0.05 AND E0 < 0.02   # the documented missing-structure definition, unchanged
